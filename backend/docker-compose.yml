version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ryda_postgis
    environment:
      POSTGRES_DB: ryda_db
      POSTGRES_USER: ryda_user
      POSTGRES_PASSWORD: ryda_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: ryda_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DB_NAME=ryda_db
      - DB_USER=ryda_user
      - DB_PASSWORD=ryda_secure_password
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data:
