<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" width="240" height="96">

  <defs>
    <!-- Gold-Orange Metallic Rim Gradient -->
    <linearGradient id="rimGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="25%" stop-color="#FFB300"/>
      <stop offset="55%" stop-color="#F57C00"/>
      <stop offset="85%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </linearGradient>
    <linearGradient id="rimInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A2500"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#FFF3E0"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2733"/>
      <stop offset="50%" stop-color="#12171F"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="skyBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5C8BB5"/>
      <stop offset="60%" stop-color="#A5C4DF"/>
      <stop offset="100%" stop-color="#DCE8F2"/>
    </linearGradient>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8E24AA" stop-opacity="0.3"/>
      <stop offset="20%" stop-color="#D84315"/>
      <stop offset="65%" stop-color="#FB8C00"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#CFD8DC"/>
      <stop offset="80%" stop-color="#90A4AE"/>
      <stop offset="100%" stop-color="#ECEFF1"/>
    </linearGradient>
    <linearGradient id="goldTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="40%" stop-color="#FFD54F"/>
      <stop offset="75%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="redHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="45%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#8E0000"/>
    </linearGradient>
    <clipPath id="hexClip">
      <polygon points="100,22 168,61 168,139 100,178 32,139 32,61"/>
    </clipPath>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Pill Outer Rim -->
    <rect x="8" y="8" width="224" height="80" rx="40" fill="url(#rimGold)"/>
    <rect x="11" y="11" width="218" height="74" rx="37" fill="#161C24"/>
    <!-- Left Circular Emblem -->
    <circle cx="48" cy="48" r="30" fill="url(#rimGold)"/>
    <circle cx="48" cy="48" r="27" fill="#1E88E5"/>
    <clipPath id="pillCircle">
      <circle cx="48" cy="48" r="27"/>
    </clipPath>
    <g clip-path="url(#pillCircle)">

      <rect x="20" y="20" width="56" height="56" fill="#2962FF"/>
      <g fill="#ECEFF1">
        <rect x="28" y="44" width="8" height="24"/>
        <rect x="38" y="34" width="10" height="34"/>
        <rect x="50" y="39" width="9" height="29"/>
        <rect x="61" y="48" width="7" height="20"/>
      </g>

    </g>
    <circle cx="48" cy="48" r="27" fill="none" stroke="#FFD54F" stroke-width="1" stroke-opacity="0.5"/>
  </g>
</svg>